
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241109">
<title>King Ranch | Michael & Dana</title>

<style>
* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#160a05;
  font-family:Arial,sans-serif;
}

.dashboard {
  position:relative;
  width:100vw;
  height:100dvh;
  background:
    url("BD473A78-FF85-4D4A-B9EF-F92986E9F4F2.png")
    center / 100% 100% no-repeat;
  overflow:hidden;
}

/* LIVE WEATHER AND CLOCK */

.live-panel {
  position:absolute;
  top:8%;
  height:13%;
  background:linear-gradient(145deg,#3c2111,#170b05);
  border:2px solid #c49345;
  border-radius:9px;
  box-shadow:inset 0 0 8px #b98537;
  color:#ffe0a0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:10;
}

#weather {
  left:71%;
  width:12%;
}

#timePanel {
  left:84%;
  width:14%;
}

#temperature {
  font-size:clamp(15px,2vw,27px);
  font-weight:bold;
  color:#ffdf91;
}

#weatherDescription {
  font-size:clamp(8px,1vw,13px);
  margin-top:4px;
}

#clock {
  font-family:Georgia,serif;
  font-size:clamp(17px,2.2vw,30px);
  font-weight:bold;
  color:#ffe2a1;
  white-space:nowrap;
}

#date {
  font-family:Georgia,serif;
  font-size:clamp(10px,1.2vw,16px);
  margin-top:5px;
  color:#ffe2a1;
  white-space:nowrap;
}

/* GOOGLE MAPS */

#mapFrame {
  position:absolute;
  left:2.3%;
  top:27%;
  width:56.5%;
  height:70%;
  border:3px solid #bd8a43;
  border-radius:12px;
  overflow:hidden;
  background:#1c261c;
  z-index:2;
}

#mapFrame iframe {
  width:100%;
  height:100%;
  border:0;
}

.mapSearch {
  position:absolute;
  z-index:5;
  left:3%;
  top:3%;
  width:94%;
  display:flex;
  gap:5px;
}

.mapSearch input {
  flex:1;
  min-width:0;
  padding:12px;
  border:1px solid #c99b57;
  border-radius:9px;
  font-size:15px;
  background:white;
  color:#222;
}

.mapSearch button {
  border:0;
  border-radius:8px;
  background:#1769db;
  color:white;
  padding:9px;
  font-weight:bold;
}

.mapButtons {
  position:absolute;
  z-index:5;
  right:3%;
  bottom:3%;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.mapButtons button {
  background:#2d190e;
  color:#ffe0a0;
  border:1px solid #d4a45a;
  border-radius:8px;
  padding:10px;
  font-weight:bold;
}

/* PANDORA */

.pandora {
  position:absolute;
  left:60%;
  top:28%;
  width:38%;
  height:19%;
  z-index:8;
  background:linear-gradient(130deg,#00123c,#003a85,#00102c);
  border:3px solid #c79447;
  border-radius:15px;
  color:white;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  box-shadow:inset 0 0 15px #2476ff;
}

.pandora strong {
  font-size:clamp(17px,3vw,36px);
}

.pandora span {
  font-size:clamp(11px,1.7vw,20px);
  margin-top:7px;
}

/* PHONE AND MESSAGES */

.appButtons {
  position:absolute;
  left:60%;
  top:49%;
  width:38%;
  height:19%;
  display:flex;
  gap:3%;
  z-index:12;
}

.appButton {
  width:48.5%;
  height:100%;
  border:3px solid #c9974d;
  border-radius:15px;
  background:linear-gradient(145deg,#482916,#1c0c05);
  color:#ffe3a6;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  box-shadow:inset 0 0 12px #b17c39;
  gap:7px;
}

.appButton .symbol {
  font-size:clamp(30px,5vw,57px);
}

.appButton strong {
  font-family:Georgia,serif;
  font-size:clamp(13px,1.8vw,22px);
}

/* MAP FULL SCREEN */

#mapFrame.full {
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  z-index:1000;
  border:0;
  border-radius:0;
}

#closeMap {
  display:none;
  position:fixed;
  top:12px;
  right:12px;
  z-index:1010;
  padding:12px 18px;
  background:#29160a;
  color:#ffe0a0;
  border:2px solid #d3a45a;
  border-radius:9px;
  font-weight:bold;
}

#mapFrame.full #closeMap {
  display:block;
}

#gpsStatus {
  position:absolute;
  left:8px;
  bottom:8px;
  z-index:6;
  color:white;
  background:#24150de8;
  border-radius:6px;
  padding:6px;
  font-size:11px;
}

@media(orientation:portrait) {
  .dashboard {
    width:100vw;
    height:56.25vw;
    position:absolute;
    top:50%;
    transform:translateY(-50%);
  }
}
</style>
</head>

<body>

<div class="dashboard">

  <!-- LIVE WEATHER -->
  <div class="live-panel" id="weather">
    <div id="temperature">--°F</div>
    <div id="weatherDescription">Longview, TX</div>
  </div>

  <!-- LIVE CLOCK AND DATE -->
  <div class="live-panel" id="timePanel">
    <div id="clock">--:--</div>
    <div id="date">---</div>
  </div>

  <!-- GOOGLE MAPS -->
  <div id="mapFrame">

    <iframe
      id="googleMap"
      title="Google Maps Longview"
      src="https://maps.google.com/maps?q=Longview%2C%20Texas&z=13&output=embed"
      allowfullscreen>
    </iframe>

    <form class="mapSearch" onsubmit="searchMaps(event)">
      <input
        id="destination"
        type="search"
        placeholder="Search Google Maps..."
        aria-label="Search destination">
      <button type="submit">GO</button>
    </form>

    <div class="mapButtons">
      <button onclick="getDirections()">Directions</button>
      <button onclick="useMyLocation()">My Location</button>
      <button onclick="expandMap()">Expand</button>
    </div>

    <button id="closeMap" onclick="closeMap()">Close Map</button>

    <div id="gpsStatus">GPS ready</div>
  </div>

  <!-- PANDORA -->
  <a class="pandora"
     href="https://www.pandora.com/"
     target="_blank"
     rel="noopener">
    <strong>🔵 Pandora</strong>
    <span>◀　▶　▶</span>
  </a>

  <!-- PHONE AND MESSAGES -->
  <div class="appButtons">

    <a class="appButton" href="tel:">
      <span class="symbol">📞</span>
      <strong>Phone</strong>
    </a>

    <a class="appButton" href="sms:">
      <span class="symbol">💬</span>
      <strong>Messages</strong>
    </a>

  </div>

</div>

<script>
"use strict";

/* CLOCK AND DATE: LONGVIEW LOCAL TIME */

function updateClock() {
  const now = new Date();

  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat("en-US", {
      timeZone:"America/Chicago",
      hour:"numeric",
      minute:"2-digit"
    }).format(now);

  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-US", {
      timeZone:"America/Chicago",
      weekday:"short",
      month:"short",
      day:"numeric",
      year:"numeric"
    }).format(now);
}

updateClock();
setInterval(updateClock,10000);


/* ACTUAL LONGVIEW WEATHER */

async function updateWeather() {
  const temp = document.getElementById("temperature");
  const description =
    document.getElementById("weatherDescription");

  try {
    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=32.5007" +
      "&longitude=-94.7405" +
      "&current=temperature_2m,weather_code" +
      "&temperature_unit=fahrenheit" +
      "&timezone=America%2FChicago";

    const response = await fetch(url);
    if (!response.ok) throw Error("Weather unavailable");

    const data = await response.json();
    const current = data.current;

    const code = current.weather_code;
    const degrees = Math.round(current.temperature_2m);

    let icon = "☀";
    let condition = "Clear";

    if ([1,2,3].includes(code)) {
      icon = "⛅";
      condition = "Cloudy";
    }
    if ([45,48].includes(code)) {
      icon = "🌫";
      condition = "Fog";
    }
    if (code >= 51 && code <= 67) {
      icon = "🌧";
      condition = "Rain";
    }
    if (code >= 71 && code <= 77) {
      icon = "❄";
      condition = "Snow";
    }
    if (code >= 80 && code <= 82) {
      icon = "🌧";
      condition = "Showers";
    }
    if (code >= 95) {
      icon = "⛈";
      condition = "Storm";
    }

    temp.textContent = icon + " " + degrees + "°F";
    description.textContent = condition + " · Longview, TX";

  } catch (error) {
    temp.textContent = "--°F";
    description.textContent = "Weather unavailable";
  }
}

updateWeather();
setInterval(updateWeather,900000);


/* GOOGLE MAPS SEARCH */

function searchMaps(event) {
  event.preventDefault();

  const query =
    document.getElementById("destination").value.trim();

  if (!query) return;

  const url =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(query);

  window.location.href = url;
}


/* GOOGLE MAPS DIRECTIONS */

let currentGPS = null;

function getDirections() {
  const destination =
    document.getElementById("destination").value.trim();

  if (!destination) {
    document.getElementById("gpsStatus").textContent =
      "Enter a destination first";
    document.getElementById("destination").focus();
    return;
  }

  let url =
    "https://www.google.com/maps/dir/?api=1";

  if (currentGPS) {
    url += "&origin=" +
      encodeURIComponent(
        currentGPS.latitude + "," +
        currentGPS.longitude
      );
  }

  url += "&destination=" +
    encodeURIComponent(destination) +
    "&travelmode=driving";

  window.location.href = url;
}


/* GPS LOCATION */

function useMyLocation() {
  if (!navigator.geolocation) {
    document.getElementById("gpsStatus").textContent =
      "GPS not available";
    return;
  }

  document.getElementById("gpsStatus").textContent =
    "Finding your location...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      currentGPS = {
        latitude:position.coords.latitude,
        longitude:position.coords.longitude
      };

      document.getElementById("gpsStatus").textContent =
        "GPS active · ±" +
        Math.round(position.coords.accuracy) + " m";

      document.getElementById("googleMap").src =
        "https://maps.google.com/maps?q=" +
        currentGPS.latitude + "," +
        currentGPS.longitude +
        "&z=16&output=embed";
    },
    function() {
      document.getElementById("gpsStatus").textContent =
        "Location permission or GPS unavailable";
    },
    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:5000
    }
  );
}


/* FULL SCREEN MAP */

function expandMap() {
  const frame = document.getElementById("mapFrame");
  frame.classList.add("full");
}

function closeMap() {
  document.getElementById("mapFrame")
    .classList.remove("full");
}
</script>

</body>
</html>
